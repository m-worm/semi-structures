name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The solid backend renders through VTK/OSMesa; on Linux runners it
      # needs an off-screen display before PyVista is imported.
      - name: Set up headless display
        if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v3

      - name: Install the package and both extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[solid,dev,mcp]"

      - name: Run the test suite
        run: python -m pytest

      # The console scripts are part of the public surface; a packaging
      # mistake would only show up when they are actually invoked.
      - name: Check the command-line entry points
        run: |
          semi-structures --version
          semi-structures examples --table
          semi-structures example damascene > cell.json
          semi-structures validate cell.json
          semi-structures render cell.json -o cell.png --view section --dpi 80
          semi-structures export cell.json

  figures:
    name: Regenerate every example figure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pyvista/setup-headless-display-action@v3

      - name: Install the package and both extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[solid,dev,mcp]"

      # Every generator must run clean: this is what catches a palette or
      # print-floor regression that the unit tests do not reach.
      - name: Build all figures
        run: python examples/run_all.py

      - name: Upload the regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: docs/figures/

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build

      - name: Check the metadata
        run: python -m pip install twine && python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
